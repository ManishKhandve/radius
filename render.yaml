services:
  - type: web
    name: whatsapp-crm
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: NODE_ENV=production node index.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: BUSINESS_NAME
        sync: false
      - key: CONTACT_NUMBER
        sync: false
      - key: BOT_ENABLED
        value: "true"
      - key: WELCOME_MESSAGE
        sync: false
      - key: OWNER_PHONE
        sync: false
